<a class="card h-100 listing-card text-decoration-none text-reset" [routerLink]="['/listing', listing().id]"
  tabindex="0" (keydown.enter)="$event.preventDefault(); $any($event.currentTarget).click()"
  (keydown.space)="$event.preventDefault(); $any($event.currentTarget).click()">
  <div class="listing-media">
    <img [src]="listing().photos[0]" class="listing-img" [alt]="listing().title">
  </div>
  <div class="card-body d-flex flex-column">
    <div class="listing-card-top">
      <div>
        <h5 class="card-title">{{ listing().title }}</h5>
        <p class="text-muted mb-1">{{ listing().city }} | {{ listing().sqft }} sq ft</p>
      </div>
      <button type="button" class="btn favourite-badge" [class.btn-danger]="interest.isFavourite(listing().id)"
        [class.btn-outline-danger]="!interest.isFavourite(listing().id)"
        [title]="interest.isFavourite(listing().id) ? 'Favourite' : 'Save to favourites'"
        (click)="toggleFavourite($event)" aria-label="Toggle favourite">
        {{ interest.isFavourite(listing().id) ? '♥' : '♡' }}
      </button>
    </div>
    <p class="fw-bold mb-2">{{ listing().rent | currency: 'INR' : 'symbol' : '1.0-0' }} / month</p>
    <p class="card-text small mb-0">{{ listing().description.slice(0, 90) }}...</p>
  </div>
</a>
